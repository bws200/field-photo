name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html app.js styles.css manifest.webmanifest service-worker.js icon.svg icon-192.png icon-512.png _site/
          python3 - <<'PY'
          import html
          import pathlib
          import subprocess
          import os

          version = os.environ["GITHUB_SHA"][:7]
          message = subprocess.run(
              ["git", "log", "-1", "--format=%s"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()

          replacements = {
              pathlib.Path("_site/index.html"): (
                  ('id="app-version">dev</span>', f'id="app-version">{version}</span>'),
                  ('id="app-commit-message">local version</span>',
                   f'id="app-commit-message">{html.escape(message)}</span>'),
              ),
              pathlib.Path("_site/service-worker.js"): (
                  ('const APP_VERSION = "dev";', f'const APP_VERSION = "{version}";'),
              ),
          }
          for path, pairs in replacements.items():
              content = path.read_text()
              for old, new in pairs:
                  if old not in content:
                      raise RuntimeError(f"Build placeholder not found in {path}: {old}")
                  content = content.replace(old, new, 1)
              path.write_text(content)
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep only latest Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: "github-pages",
              per_page: 100,
            });
            deployments.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
            for (const deployment of deployments.slice(1)) {
              const { data: [latestStatus] } = await github.rest.repos.listDeploymentStatuses({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                per_page: 1,
              });
              if (latestStatus && latestStatus.state !== "inactive") {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  state: "inactive",
                  description: "Superseded by a newer Pages deployment.",
                });
              }
              await github.rest.repos.deleteDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
              });
            }
